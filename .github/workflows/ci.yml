name: CI

# Every push and pull request. Deliberately does NOT build the live ISO: that
# takes fifteen minutes and needs root, a loop device and ten gigabytes of
# scratch, none of which should stand between a contributor and a green tick on
# a one-line change. The ISO has its own workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install --disable-pip-version-check "ruff>=0.5"

      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Debian 12 ships and therefore the floor; the newer ones
        # are here to catch a deprecation before a distribution upgrade does.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        # PyGObject is absent on the runner, and that is the point: the
        # discovery, erase and certificate layers must not import the
        # interface, and a suite that needed GTK could not prove it.
        run: python -m pytest -q

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax
        # A syntax error in build-iso.sh otherwise costs a fifteen-minute
        # build to discover, and the script is long enough that it happens.
        run: |
          for script in packaging/iso/build-iso.sh \
                        packaging/iso/hooks/*.hook.binary \
                        tools/*.sh; do
            [ -f "$script" ] || continue
            echo "checking $script"
            bash -n "$script"
          done

      - name: Refuse carriage returns
        # These files are executed by bash and by Plymouth on Linux. A CR is
        # read as part of the command and the script dies on its first line.
        # .gitattributes is meant to prevent this; this step is the check that
        # it did.
        #
        # Counted in Python rather than with a shell pattern. A carriage-return
        # pattern written for the shell can silently match every line in a file
        # instead of the CRs in it, which once produced a wholly convincing
        # false report of corruption in this repository.
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import sys
          from pathlib import Path

          CR = bytes([13])

          listed = subprocess.run(
              [
                  "git", "ls-files",
                  "*.sh", "*.py", "*.script", "*.binary",
                  "packaging/share/bin/zeroize",
              ],
              capture_output=True,
              text=True,
              check=True,
          )
          files = listed.stdout.split()

          bad = 0
          for name in files:
              count = Path(name).read_bytes().count(CR)
              if count:
                  bad += 1
                  print(f"::error file={name}::{count} carriage return(s)")

          print(f"checked {len(files)} file(s), {bad} with carriage returns")
          sys.exit(1 if bad else 0)
          PYEOF

  package:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        target: [deb, rpm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev rpm librsvg2-bin fonts-inter

      - name: Build
        run: python3 build.py ${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zeroize-${{ matrix.target }}
          path: |
            build/dist/*.deb
            build/dist/*.rpm
          if-no-files-found: error
          retention-days: 14
