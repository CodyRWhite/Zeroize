name: Release

# Tag a version and this publishes it. The ISO is built by the Live ISO
# workflow, which the same tag triggers; this job waits for that artefact
# rather than building the image twice.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  packages:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev rpm librsvg2-bin fonts-inter

      - name: Check the tag matches the version in the source
        # A release whose artefacts disagree with its tag is worse than no
        # release: the .deb installs as one version and the tag claims another,
        # and nothing downstream can tell which is right.
        run: |
          source_version=$(python3 -c "import zeroize; print(zeroize.__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "source: $source_version"
          echo "tag:    $tag_version"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match zeroize.__version__ ($source_version)"
            exit 1
          fi

      - name: Build
        run: |
          python3 build.py deb
          python3 build.py rpm

      - name: Checksums
        run: |
          cd build/dist
          sha256sum ./*.deb ./*.rpm > packages.sha256
          cat packages.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: build/dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [packages]
    steps:
      - uses: actions/checkout@v4

      - name: Collect the packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts

      - name: Wait for the live image
        # The Live ISO workflow runs on the same tag. Poll for its artefact
        # rather than rebuilding a two-gigabyte image a second time.
        id: image
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: zeroize-live-image
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}

      - name: Note a missing image
        if: steps.image.outcome != 'success'
        run: |
          echo "::warning::the live image artefact was not available; publishing packages only"

      - name: List what will be published
        run: ls -la artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Zeroize Drive Wiper ${{ github.ref_name }}

            **Write `zeroize-live-bookworm-amd64-usb.img` with Rufus in DD Image
            mode**, not ISO mode. The `.img` carries the `ZEROIZE-OUT` partition
            that certificates are written to; the `.iso` does not.

            Verify before writing:

            ```sh
            sha256sum -c zeroize-live-bookworm-amd64-usb.img.sha256
            ```

            > [!IMPORTANT]
            > Non-Windows Secure Boot certificates must be enabled in firmware.
            > The third-party *Microsoft UEFI CA* signs Linux shim; the
            > similarly named *Windows UEFI CA* signs only Windows.
