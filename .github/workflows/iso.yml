name: Live ISO

# Run the image build by hand - when the live-build wrapper, the GRUB or
# Plymouth themes, or the boot hooks change, and you want to see the result
# without cutting a release.
#
# Deliberately NOT triggered by tags any more. It used to be, and Release was
# too, so a tag started both at once: Release finished its packages in two
# minutes, looked for an ISO that was still twenty minutes away, and published
# without it. Release now calls the build itself and waits for it.
#
# Kept out of CI for a different reason: it needs root, loop devices and ten
# gigabytes of scratch, and takes fifteen to twenty-five minutes. That does not
# belong between a contributor and a green tick on a one-line change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Live image
    uses: ./.github/workflows/iso-build.yml
